# fly.toml app configuration file generated for doot-agent on 2026-08-19T04:18:45Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'doot-agent'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  DOOT_LOG_LEVEL = 'info'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
